<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multitool</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
    }
    h1 {
      font-size: 20px;
      text-align: center;
      margin: 8px 0;
    }
    textarea {
      width: 100%;
      height: 60px;
      font-size: 16px;
      box-sizing: border-box;
      background-color: #222;
      color: #eee;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 6px;
    }
    button {
      width: 100%;
      font-size: 16px;
      padding: 10px;
      margin-top: 6px;
      background-color: #e35a2b;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
    #output {
      font-size: 16px;
      word-wrap: break-word;
      background-color: #222;
      padding: 8px;
      border-radius: 6px;
      margin-top: 10px;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <h1>Multitool</h1>

  <textarea id="input" placeholder="Type text here"></textarea>

  <button onclick="encodeBase64()">Base64 Encode</button>
  <button onclick="decodeBase64()">Base64 Decode</button>
  <button onclick="encodeHex()">Hex Encode</button>
  <button onclick="decodeHex()">Hex Decode</button>
  <button onclick="encodeURL()">URL Encode</button>
  <button onclick="decodeURL()">URL Decode</button>

  <p id="output">Result appears here</p>

  <script>
    function show(result) {
      document.getElementById("output").textContent = result;
    }
    function getInput() {
      return document.getElementById("input").value;
    }

    function encodeBase64() {
      show(btoa(getInput()));
    }
    function decodeBase64() {
      show(atob(getInput()));
    }
    function encodeHex() {
      var text = getInput();
      var hex = "";
      for (var i = 0; i < text.length; i++) {
        hex += text.charCodeAt(i).toString(16).padStart(2, "0");
      }
      show(hex);
    }
    function decodeHex() {
      var hex = getInput();
      var text = "";
      for (var i = 0; i < hex.length; i += 2) {
        text += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
      }
      show(text);
    }
    function encodeURL() {
      show(encodeURIComponent(getInput()));
    }
    function decodeURL() {
      show(decodeURIComponent(getInput()));
    }
  </script>
</body>
</html>
